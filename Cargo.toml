[workspace]
members = [
    "crates/open-search-core",
    "crates/open-search-providers",
    "crates/open-search-runtime",
    "crates/open-search-server",
]
default-members = ["crates/open-search-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
open-search-core = { path = "crates/open-search-core" }
open-search-providers = { path = "crates/open-search-providers" }
open-search-runtime = { path = "crates/open-search-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
