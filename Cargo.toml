[workspace]
members = [
    "crates/open-search-core",
    "crates/open-search-providers",
    "crates/open-search-runtime",
    "crates/open-search-server",
]
default-members = ["crates/open-search-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.32"
open-search-core = { path = "crates/open-search-core" }
open-search-providers = { path = "crates/open-search-providers" }
open-search-runtime = { path = "crates/open-search-runtime" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "stream", "form"] }
rmcp = { version = "3.1.4", features = ["transport-streamable-http-server"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
